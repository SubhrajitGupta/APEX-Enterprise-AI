[project]
name = "apex-enterprise-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.44.6",
    "fastapi>=0.165.0",
    "glassflow-rius>=1.6.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langgraph>=1.2.23",
    "pinecone>=10.3.0",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
apex-enterprise-ai = "apex_enterprise_ai:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
